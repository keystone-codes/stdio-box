# Example only. keystonectl prints this file and never merges it into your policy.
# The box does not check roles: whoever the policy lets call tavily_creds_* manages
# everyone's accounts in this box. Do not give a non-administrator role tavily_* :
# it also matches tavily_creds_*.
version: "2.0.0"
default_deny: true
roles:
  tavily_reader:
    description: "Read Tavily through the tavily box."
    allow: [tavily_creds_whoami, tavily_creds_providers]
  tavily_writer:
    description: "Read and change Tavily through the tavily box."
    allow: [tavily_tavily_search, tavily_tavily_extract, tavily_tavily_crawl, tavily_tavily_map, tavily_tavily_research, tavily_creds_whoami, tavily_creds_providers]
  tavily_box_admin:
    description: "Manage accounts and bindings in the tavily box."
    allow: ["tavily_creds_*"]
critical_tools: [tavily_creds_profile_create, tavily_creds_profile_rotate, tavily_creds_profile_delete, tavily_creds_bind, tavily_creds_unbind, tavily_creds_desired_set, tavily_creds_sync]
# Only a signed-in person may change accounts; API keys and service accounts may not.
requires_human_identity: [tavily_creds_profile_create, tavily_creds_profile_rotate, tavily_creds_profile_delete, tavily_creds_bind, tavily_creds_unbind, tavily_creds_desired_set, tavily_creds_sync]
