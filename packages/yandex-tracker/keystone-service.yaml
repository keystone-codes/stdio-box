schema_version: 1
kind: service
name: yandex-tracker
version: 1.1.0
publisher: keystone-codes
summary: "Yandex Tracker tools (@fractalizer/mcp-server-yandex-tracker 5.1.0) behind Keystone; each person, service or role uses its own account."
homepage: https://github.com/keystone-codes/stdio-box/tree/yandex-tracker/v1.1.0/packages/yandex-tracker
compat:
  keystone_mcp: ">=0.5.0,<2.0"
  contracts: [upstream-registry/1, identity-assertion/1]
mcp:
  container: mcp
  transport: http
  path: /mcp
  healthz: /healthz
  namespace: yandex_tracker
  bearer_env: BOX_BEARER_TOKEN
  tools:
