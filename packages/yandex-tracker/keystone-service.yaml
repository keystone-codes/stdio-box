identity:
  signed_assertion: required
  secret_env: BOX_IDENTITY_SECRET
  audience_env: BOX_IDENTITY_AUDIENCE
containers:
  mcp:
    image: "ghcr.io/keystone-codes/stdio-box:0.3.1@sha256:e73fe9b39fd6aafdb22da96609fd593b710ad1e2491df02dd097e5fec4a65c97"
    port: 8081
    env:
      - name: BOX_PROVIDER
        default: "yandex-tracker"
        description: "Provider directory inside the stdio-box image."
      - name: BOX_COMMAND
        default: "npx -y @fractalizer/mcp-server-yandex-tracker@5.1.0"
        description: "Server to run. The package and version must match the provider lock file."
    secrets:
      - name: BOX_STORE_KEY
        generate:
          bytes: 32
    volumes:
      - name: store
        path: /data
      - name: cache
        path: /cache
    healthcheck:
      path: /healthz
      interval: 10s
      start_period: 300s
needs: []
requires: []
public_paths:
  - /creds/
public_base_url_env: BOX_PUBLIC_BASE_URL
recommended_policy: policy.example.yaml
