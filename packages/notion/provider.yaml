schema_version: 1
name: notion
title: Notion
server:
  command: "npx -y @notionhq/notion-mcp-server@2.6.0"
  bin: notion-mcp-server
  lock: package-lock.json
fields:
  - {name: NOTION_TOKEN, type: string, secret: true, hint: "Integration token from notion.so/profile/integrations"}
variants:
  - name: token
    fields: [NOTION_TOKEN]
    checks:
      - http:
          method: GET
          url: "https://api.notion.com/v1/users/me"
          auth: {bearer: NOTION_TOKEN}
          headers: {Notion-Version: "2022-06-28"}
          expect_status: [200]
          identity: name
tools:
  strip_prefix: "API-"
  normalize: snake
discovery:
  mode: placeholder
  env: {NOTION_TOKEN: discovery-placeholder}
identity_to_child: none
