# Example only. keystonectl prints this file and never merges it into your policy.
# The box does not check roles: whoever the policy lets call notion_creds_* manages
# everyone's accounts in this box. Do not give a non-administrator role notion_* :
# it also matches notion_creds_*.
version: "2.0.0"
default_deny: true
roles:
  notion_reader:
    description: "Read Notion through the notion box."
    allow: [notion_get_user, notion_get_users, notion_get_self, notion_get_block_children, notion_retrieve_a_block, notion_retrieve_a_page, notion_retrieve_a_page_property, notion_retrieve_a_comment, notion_retrieve_a_data_source, notion_list_data_source_templates, notion_retrieve_a_database, notion_retrieve_page_markdown, notion_creds_whoami, notion_creds_providers]
  notion_writer:
    description: "Read and change Notion through the notion box."
    allow: [notion_get_user, notion_get_users, notion_get_self, notion_post_search, notion_get_block_children, notion_patch_block_children, notion_retrieve_a_block, notion_update_a_block, notion_delete_a_block, notion_retrieve_a_page, notion_patch_page, notion_post_page, notion_retrieve_a_page_property, notion_retrieve_a_comment, notion_create_a_comment, notion_query_data_source, notion_retrieve_a_data_source, notion_update_a_data_source, notion_create_a_data_source, notion_list_data_source_templates, notion_retrieve_a_database, notion_move_page, notion_retrieve_page_markdown, notion_update_page_markdown, notion_creds_whoami, notion_creds_providers]
  notion_box_admin:
    description: "Manage accounts and bindings in the notion box."
    allow: ["notion_creds_*"]
critical_tools: [notion_creds_profile_create, notion_creds_profile_rotate, notion_creds_profile_delete, notion_creds_bind, notion_creds_unbind, notion_post_search, notion_patch_block_children, notion_update_a_block, notion_delete_a_block, notion_patch_page, notion_post_page, notion_create_a_comment, notion_query_data_source, notion_update_a_data_source, notion_create_a_data_source, notion_move_page, notion_update_page_markdown]
# Only a signed-in person may change accounts; API keys and service accounts may not.
requires_human_identity: [notion_creds_profile_create, notion_creds_profile_rotate, notion_creds_profile_delete, notion_creds_bind, notion_creds_unbind]
