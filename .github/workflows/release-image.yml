name: Release image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver version (must match pyproject.toml)
        required: true

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/keystone-codes/stdio-box

jobs:
  build:
    name: Build and push image by digest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Validate version
        run: |
          set -euo pipefail
          v="${{ github.event.inputs.version }}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
          test "$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" = "$v"
          if git rev-parse "v$v" >/dev/null 2>&1; then echo "tag v$v already exists"; exit 1; fi

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test
        run: uv run pytest -q -m "not integration"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only, with no version tag yet: the image is not
      # "released" (no tag a user would pull) until image-scan passes and
      # the publish job below tags it.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true

  image-scan:
    name: Image scan (${{ matrix.platform }})
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same action and parameters as keystone-mcp's release.yml image-scan
      # job: a fixable CRITICAL or HIGH finding fails the job and blocks
      # publish below, so the version tag never points at a vulnerable image.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"

  publish:
    name: Tag release and open pin PR
    needs: [build, image-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the scanned digest with the release version
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:${{ github.event.inputs.version }}" \
            "${IMAGE}@${{ needs.build.outputs.digest }}"

      - name: Pin digest and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v="${{ github.event.inputs.version }}"
          digest="${{ needs.build.outputs.digest }}"
          ref="${IMAGE}:${v}@${digest}"
          branch="release/pin-$v"
          git checkout -b "$branch"
          pinned_output=$(uv run --quiet python scripts/pin_digest.py "$ref")
          pinned=()
          if [ -n "$pinned_output" ]; then
            mapfile -t pinned <<< "$pinned_output"
          fi
          git add IMAGE packages/*/keystone-service.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: pin image digest for $v"
          git push -u origin "$branch"
          pkg_md=""
          if [ "${#pinned[@]}" -gt 0 ]; then
            for row in "${pinned[@]}"; do
              name="${row%% *}"
              version="${row#* }"
              pkg_md+="- \`${name}\` ${version}"$'\n'
            done
          fi
          gh pr create --title "Pin stdio-box image digest for $v" --body "$(cat <<EOF
          Release \`$v\` image digest: \`${digest}\`

          \`IMAGE\` is \`${ref}\`.

          Packages:
          ${pkg_md}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )"
