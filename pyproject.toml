[project]
name = "stdio-box"
version = "0.1.0"
description = "One container image that runs a third-party MCP stdio server behind Keystone."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "mcp==1.28.1",
    "starlette",
    "uvicorn",
    "pyjwt>=2.8",
    "cryptography>=43",
    "pyyaml>=6",
    "jsonschema>=4.23",
    "httpx>=0.28",
    "packaging>=24",
]

[project.scripts]
stdio-box = "stdio_box.cli:main"
credsctl = "stdio_box.cli:credsctl_main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "respx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stdio_box"]

[tool.hatch.build.targets.wheel.sources]
"src/stdio_box" = "stdio_box"

[tool.hatch.build.targets.wheel.force-include]
"schemas/provider-v1.json" = "stdio_box/schemas/provider-v1.json"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
exclude = ["src/stdio_box/_vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["stdio_box"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: Docker-backed checks",
]
